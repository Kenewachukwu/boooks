<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06123a">
<title>booooks reader</title>
<meta name="description" content="Stories set as posters you swipe through, with sound.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet">
<link rel="stylesheet" href="reader.css">
</head>
<body>
<!-- when a reader arrives from a cover on the front page, that same cover holds the screen until the story is ready -->
<div class="splash" id="splash" aria-hidden="true"></div>
<script>(function () { var s = document.getElementById('splash'); try { var f = JSON.parse(sessionStorage.getItem('booooks.fly') || 'null'); sessionStorage.removeItem('booooks.fly'); if (f && Date.now() - f.t < 8000 && /^[\w\/.:%?=&-]+$/.test(f.src)) { s.style.backgroundImage = 'url("' + f.src + '")'; s.className = 'splash on'; setTimeout(function () { s.remove(); }, 9000); return; } } catch (e) { /* no splash */ } s.remove(); })();</script>
<main class="stage" id="stage">
  <div class="scrim"></div>

  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <header class="hud">
    <div class="count" id="count" aria-hidden="true"></div>
    <div class="hud-right">
    <a class="sound back" id="back" href="/" aria-label="Back to all stories">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <button class="sound" id="anim" type="button" aria-pressed="true" aria-label="Text animation on. Tap to turn off">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z" fill="currentColor"/>
        <path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="currentColor"/>
        <path class="cross" d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Sound off. Tap to turn on">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path class="cross" d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    </div>
  </header>

  <div class="pages" id="pages" tabindex="0" aria-label="Book pages. Swipe up or down to turn the page."></div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</main>
<noscript><p style="color:#fdf3c4;padding:2rem">This reader needs JavaScript.</p></noscript>
<script type="module" src="reader.js"></script>
</body>
</html>
