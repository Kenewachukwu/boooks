<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06123a">
<title>Rejuvenating · booooks reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap">
<link rel="stylesheet" href="reader.css">
</head>
<body>
<main class="stage" id="stage">
  <video class="bg" id="bg" src="media/night-field.mp4" poster="media/night-field.jpg" muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
  <div class="scrim"></div>

  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <header class="hud">
    <div class="count" id="count" aria-hidden="true"></div>
    <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Sound on">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path class="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path class="cross" d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </header>

  <div class="pages" id="pages" tabindex="0" aria-label="Book pages. Swipe up or down to turn the page."></div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</main>
<noscript><p style="color:#fdf3c4;padding:2rem">This reader needs JavaScript.</p></noscript>
<script type="module" src="reader.js"></script>
</body>
</html>
